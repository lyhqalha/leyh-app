name: Build APK v36

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v36
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q leyh-apk-ready-v36.zip -d extracted

          if [ -d extracted/v36work ]; then
            cp -R extracted/v36work/. .
          else
            cp -R extracted/. .
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Prepare Android
        run: bash scripts/prepare_android.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leyh-v36-kareem-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
