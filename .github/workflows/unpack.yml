name: Build ليه قالها - Audar Story Narrator v43

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Extract V43 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="leyh-apk-ready-v43-audar-compatible.zip"

          test -f "$ZIP" || {
            echo "ERROR: ZIP file not found: $ZIP"
            ls -lah
            exit 1
          }

          rm -rf project
          mkdir -p project
          unzip -q "$ZIP" -d project

          if [ -f project/v35work/package.json ]; then
            echo "PROJECT_ROOT=project/v35work" >> "$GITHUB_ENV"
          elif [ -f project/package.json ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"
          else
            echo "ERROR: package.json not found"
            find project -maxdepth 5 -name package.json -print
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git unzip build-essential cmake

      - name: Install CPU speech dependencies
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0+cpu torchaudio==2.6.0+cpu

          python -m pip install transformers==4.49.0

          # Keep torchao compatible with PyTorch 2.6.
          python -m pip install torchao==0.12.0

          # Install the speech model dependencies.
          python -m pip install \
            neucodec==0.0.6 \
            soundfile==0.13.1 \
            huggingface_hub==0.30.2 \
            llama-cpp-python==0.3.16

          # Fail early if dependency resolution changed the pinned versions
          # or if the speech libraries cannot be imported.
          python - <<'PY'
          import torch
          import torchaudio
          import transformers
          import torchao
          import neucodec

          print("torch:", torch.__version__)
          print("torchaudio:", torchaudio.__version__)
          print("transformers:", transformers.__version__)
          print("torchao:", torchao.__version__)
          print("neucodec import: OK")

          assert torch.__version__.startswith("2.6.0"), (
              f"Unexpected torch version: {torch.__version__}"
          )
          assert torchaudio.__version__.startswith("2.6.0"), (
              f"Unexpected torchaudio version: {torchaudio.__version__}"
          )
          assert torchao.__version__.startswith("0.12.0"), (
              f"Unexpected torchao version: {torchao.__version__}"
          )
          PY

      - name: Check audio generator
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/generate_story_audio.py
          test -f src/utils/audioService.ts
          echo "Audio generator and audio service found."

      - name: Generate story MP3 files
        working-directory: ${{ env.PROJECT_ROOT }}
        run: python scripts/generate_story_audio.py

      - name: Verify generated audio
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          test -d public/story-audio

          COUNT=$(find public/story-audio -type f -name '*.mp3' -size +10k | wc -l)

          echo "Validated MP3 count: $COUNT"
          test "$COUNT" -ge 1

          grep -R "story-audio" -n src

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --legacy-peer-deps

      - name: Pin TypeScript
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --save-dev typescript@5.9.3 --legacy-peer-deps

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/local-notifications@8 \
            --save --legacy-peer-deps

          npm install @capacitor/assets --save-dev --legacy-peer-deps

      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.leyhqalha.leyh',
            appName: 'ليه قالها',
            webDir: 'dist',
            plugins: {
              LocalNotifications: {
                smallIcon: 'ic_stat_icon_config_sample'
              }
            }
          };

          export default config;
          EOF

      - name: Build web app
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npx cap add android

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          chmod +x scripts/prepare_android.sh
          bash scripts/prepare_android.sh

      - name: Generate Android icons
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npx cap sync android

      - name: Verify Android resources
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/src/main/res/raw/salawat.wav
          test -f android/app/src/main/res/raw/notification.wav
          test -f android/app/src/main/java/com/leyhqalha/leyh/MainActivity.java

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leyh-story-narrator-v43
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
