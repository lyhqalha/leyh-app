name: Build ليه قالها - Story Narrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Find and extract project
        shell: bash
        run: |
          set -e

          ZIP="./leyh-apk-ready-v41-audar-story-narrator.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found:"
            echo "$ZIP"
            echo ""
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          if [ -f "project/package.json" ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"
          elif [ -f "project/v35work/package.json" ]; then
            echo "PROJECT_ROOT=project/v35work" >> "$GITHUB_ENV"
          else
            echo "ERROR: package.json not found."
            find project -maxdepth 4 -name package.json -print
            exit 1
          fi

      - name: Show project
        run: |
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git build-essential cmake

      # =========================================================
      # FIX: تثبيت إصدارات Python المتوافقة يدويًا
      # =========================================================

      - name: Create clean Python environment
        shell: bash
        run: |
          set -e

          python -m venv "$RUNNER_TEMP/audar-env"

          echo "AUDIO_PY=$RUNNER_TEMP/audar-env/bin/python" >> "$GITHUB_ENV"

          "$RUNNER_TEMP/audar-env/bin/python" -m pip install --upgrade pip setuptools wheel

      - name: Install compatible PyTorch stack
        shell: bash
        run: |
          set -e

          "$AUDIO_PY" -m pip install \
            torch==2.11.0 \
            torchaudio==2.11.0 \
            --index-url https://download.pytorch.org/whl/cpu

          "$AUDIO_PY" -m pip install \
            torchao==0.17.0 \
            neucodec==0.0.6 \
            soundfile \
            librosa \
            huggingface_hub \
            transformers \
            local-attention

      - name: Verify PyTorch stack
        shell: bash
        run: |
          set -e

          "$AUDIO_PY" - <<'PY'
          import torch
          import torchaudio
          import torchao
          import neucodec

          print("torch:", torch.__version__)
          print("torchaudio:", torchaudio.__version__)
          print("torchao:", torchao.__version__)
          print("neucodec:", getattr(neucodec, "__version__", "installed"))

          assert torch.__version__.startswith("2.11.")
          assert torchaudio.__version__.startswith("2.11.")

          print("PYTORCH STACK OK")
          PY

      # =========================================================
      # Audar GGUF runtime
      # =========================================================

      - name: Install llama.cpp Python runtime
        shell: bash
        run: |
          set -e

          CMAKE_ARGS="-DGGML_NATIVE=OFF" \
          "$AUDIO_PY" -m pip install llama-cpp-python

      # =========================================================
      # منع سكربت Audar من إعادة تثبيت Torch الخاطئ
      # =========================================================

      - name: Protect Python environment from Audar requirements
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/generate_story_audio.py")
          s = p.read_text(encoding="utf-8")

          old1 = '''run([sys.executable, "-m", "pip", "install", "-r", str(AUDIO_REPO / "examples" / "requirements.txt")])'''

          old2 = '''run([sys.executable, "-m", "pip", "install", "llama-cpp-python", "neucodec", "soundfile", "torch", "librosa", "huggingface_hub"])'''

          s = s.replace(
              old1,
              'print("Audar requirements skipped: using pinned compatible environment.", flush=True)'
          )

          s = s.replace(
              old2,
              'print("Audar runtime installs skipped: using pinned compatible environment.", flush=True)'
          )

          p.write_text(s, encoding="utf-8")

          print("generate_story_audio.py patched successfully.")
          PY

      # =========================================================
      # توليد صوت القصص
      # =========================================================

      - name: Generate story narration
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "Starting Audar story narration..."

          "$AUDIO_PY" scripts/generate_story_audio.py

      - name: Verify story audio
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ ! -d "public/story-audio" ]; then
            echo "ERROR: public/story-audio not found."
            exit 1
          fi

          COUNT=$(find public/story-audio -type f -name "*.mp3" | wc -l)

          echo "Generated MP3 files: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No MP3 files generated."
            exit 1
          fi

          find public/story-audio -type f -name "*.mp3" -print

      # =========================================================
      # Android build
      # =========================================================

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install --legacy-peer-deps

      - name: Pin TypeScript
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            --save-dev \
            typescript@5.9.3 \
            --legacy-peer-deps

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/local-notifications@8 \
            --save \
            --legacy-peer-deps

      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.leyhqalha.leyh',
            appName: 'ليه قالها',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Build web
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap add android

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          if [ -f scripts/prepare_android.sh ]; then
            chmod +x scripts/prepare_android.sh
            bash scripts/prepare_android.sh
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap sync android

      - name: Verify no Kareem or Sherpa
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if find android/app/src/main \
            -type f \
            \( \
              -iname "*.onnx" \
              -o -iname "*kareem*" \
              -o -iname "*sherpa*" \
              -o -iname "*OfflineTts*" \
            \) | grep -q .; then

            echo "ERROR: Old TTS engine found."
            find android/app/src/main \
              -type f \
              \( \
                -iname "*.onnx" \
                -o -iname "*kareem*" \
                -o -iname "*sherpa*" \
                -o -iname "*OfflineTts*" \
              \)

            exit 1
          fi

          echo "No old TTS model bundled."

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leyh-story-narrator-v41
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
