name: Build ليه قالها - Story Narrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP="./leyh-apk-ready-v41-audar-story-narrator.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found:"
            echo "$ZIP"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf project
          mkdir -p project
          unzip -q "$ZIP" -d project

          echo "Project extracted."

      - name: Locate project root
        shell: bash
        run: |
          set -e

          if [ -f "project/package.json" ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"

          elif [ -f "project/v35work/package.json" ]; then
            echo "PROJECT_ROOT=project/v35work" >> "$GITHUB_ENV"

          else
            echo "ERROR: package.json not found."
            find project -maxdepth 4 -name package.json -print
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git unzip

      - name: Prepare compatible Python environment
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          # Remove incompatible preinstalled Torch ecosystem packages
          python -m pip uninstall -y \
            torchao \
            torchtune \
            torch \
            torchaudio \
            torchvision \
            2>/dev/null || true

          # Compatible PyTorch stack
          python -m pip install \
            torch==2.7.1 \
            torchaudio==2.7.1 \
            torchvision==0.22.1

          # Important:
          # torchao < 0.18 keeps NF4Tensor in the location expected
          # by the current TorchTune/NeuCodec dependency chain.
          python -m pip install \
            torchao==0.17.0

          # Audio / model dependencies
          python -m pip install \
            neucodec==0.0.6 \
            soundfile \
            librosa \
            huggingface_hub

          echo "Checking installed versions..."

          python - <<'PY'
          import torch
          import torchao
          import neucodec

          print("torch:", torch.__version__)
          print("torchao:", torchao.__version__)
          print("neucodec:", neucodec.__version__)

          from torchao.dtypes.nf4tensor import NF4Tensor

          print("NF4Tensor import: OK")
          PY

      - name: Install llama.cpp Python runtime
        run: |
          set -e

          python -m pip install \
            llama-cpp-python==0.3.36

          python - <<'PY'
          from llama_cpp import Llama
          print("llama-cpp-python: OK")
          PY

      - name: Generate story narration
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ ! -f "scripts/generate_story_audio.py" ]; then
            echo "ERROR: generate_story_audio.py not found."
            find . -maxdepth 3 -type f -name "*.py" -print
            exit 1
          fi

          echo "Starting story narration generation..."

          python3 scripts/generate_story_audio.py

      - name: Verify story audio
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ ! -d "public/story-audio" ]; then
            echo "ERROR: public/story-audio not found."
            exit 1
          fi

          COUNT=$(find public/story-audio -type f -name "*.mp3" | wc -l)

          echo "Generated MP3 files: $COUNT"

          if [ "$COUNT" -lt 75 ]; then
            echo "ERROR: Expected at least 75 story MP3 files."
            exit 1
          fi

          find public/story-audio \
            -type f \
            -name "*.mp3" \
            -print

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install --legacy-peer-deps

      - name: Force TypeScript 5.9.3
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            --save-dev \
            typescript@5.9.3 \
            --legacy-peer-deps

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/local-notifications@8 \
            --save \
            --legacy-peer-deps

      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.leyhqalha.leyh',
            appName: 'ليه قالها',
            webDir: 'dist',
            plugins: {
              LocalNotifications: {
                smallIcon: 'ic_stat_icon_config_sample'
              }
            }
          };

          export default config;
          EOF

      - name: Build web app
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          if [ -f "scripts/prepare_android.sh" ]; then
            chmod +x scripts/prepare_android.sh
            bash scripts/prepare_android.sh
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap sync android

      - name: Verify old TTS is removed
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if find android/app/src/main \
            -type f \
            \( \
              -iname "*.onnx" \
              -o -iname "*kareem*" \
              -o -iname "*sherpa*" \
              -o -iname "*OfflineTts*" \
            \) | grep -q .; then

            echo "ERROR: Old Kareem/Sherpa TTS files detected."

            find android/app/src/main \
              -type f \
              \( \
                -iname "*.onnx" \
                -o -iname "*kareem*" \
                -o -iname "*sherpa*" \
                -o -iname "*OfflineTts*" \
              \)

            exit 1
          fi

          echo "Old TTS engine: NOT FOUND"

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leyh-story-narrator-v41
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
