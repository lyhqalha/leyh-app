package com.leyhqalha.leyh;

import android.app.Service;
import android.content.Intent;
import android.media.AudioAttributes;
import android.media.MediaPlayer;
import android.os.Handler;
import android.os.IBinder;
import android.os.Looper;

import com.k2fsa.sherpa.onnx.GeneratedAudio;
import com.k2fsa.sherpa.onnx.OfflineTts;
import com.k2fsa.sherpa.onnx.OfflineTtsConfig;
import com.k2fsa.sherpa.onnx.OfflineTtsModelConfig;
import com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig;

import java.io.File;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public final class OfflineTtsService extends Service {

    private static final String MODEL_DIR =
            "tts-model/vits-piper-ar_JO-kareem-medium";

    private final ExecutorService executor =
            Executors.newSingleThreadExecutor();

    private final Handler handler =
            new Handler(Looper.getMainLooper());

    private OfflineTts tts;
    private MediaPlayer player;
    private volatile int requestId = 0;

    @Override
    public void onCreate() {
        super.onCreate();
    }

    @Override
    public int onStartCommand(Intent intent, int flags, int startId) {

        if (intent == null) {
            return START_NOT_STICKY;
        }

        String command =
                intent.getStringExtra(OfflineTtsBridge.EXTRA_COMMAND);

        int req =
                intent.getIntExtra(
                        OfflineTtsBridge.EXTRA_REQUEST, 0);

        if ("stop".equals(command)) {
            requestId = req;
            stopAudio();
            return START_NOT_STICKY;
        }

        if ("pause".equals(command)) {
            try {
                if (player != null && player.isPlaying()) {
                    player.pause();
                }
            } catch (Throwable ignored) {
            }
            return START_NOT_STICKY;
        }

        if ("resume".equals(command)) {
            try {
                if (player != null) {
                    player.start();
                }
            } catch (Throwable ignored) {
            }
            return START_NOT_STICKY;
        }

        if ("speak".equals(command)) {

            String text =
                    intent.getStringExtra(
                            OfflineTtsBridge.EXTRA_TEXT);

            float speed =
                    intent.getFloatExtra(
                            OfflineTtsBridge.EXTRA_SPEED,
                            0.9f);

            requestId = req;
            stopAudio();

            final String finalText = text;
            final float finalSpeed = speed;

            executor.execute(() ->
                    generateAndPlay(
                            finalText,
                            finalSpeed,
                            req));
        }

        return START_NOT_STICKY;
    }

    private void generateAndPlay(
            String text,
            float speed,
            int req) {

        try {

            if (text == null || text.trim().isEmpty()) {
                throw new Exception("النص فارغ");
            }

            OfflineTts engine = getTts();

            GeneratedAudio audio =
                    engine.generate(
                            text,
                            0,
                            Math.max(
                                    0.7f,
                                    Math.min(1.25f, speed)));

            if (req != requestId) {
                return;
            }

            File output =
                    new File(
                            getCacheDir(),
                            "kareem_" + req + ".wav");

            if (!audio.save(output.getAbsolutePath())) {
                throw new Exception(
                        "تعذر إنشاء ملف الصوت");
            }

            playAudio(output, req);

        } catch (Throwable e) {

            if (req == requestId) {

                String message =
                        e.getMessage();

                if (message == null ||
                        message.trim().isEmpty()) {
                    message = "تعذر تشغيل صوت كريم";
                }

                sendError(req, message);
            }
        }
    }

    private synchronized OfflineTts getTts()
            throws Exception {

        if (tts != null) {
            return tts;
        }

        String model =
                MODEL_DIR +
                "/ar_JO-kareem-medium.onnx";

        String tokens =
                MODEL_DIR +
                "/tokens.txt";

        String dataDir =
                MODEL_DIR +
                "/espeak-ng-data";

        /*
         * Sherpa-ONNX 1.13.x Java API.
         * Use Builder API for the configuration.
         */

        OfflineTtsVitsModelConfig vits =
                OfflineTtsVitsModelConfig
                        .builder()
                        .setModel(model)
                        .setTokens(tokens)
                        .setDataDir(dataDir)
                        .build();

        OfflineTtsModelConfig modelConfig =
                OfflineTtsModelConfig
                        .builder()
                        .setVits(vits)
                        .setNumThreads(1)
                        .setDebug(false)
                        .setProvider("cpu")
                        .build();

        OfflineTtsConfig config =
                OfflineTtsConfig
                        .builder()
                        .setModel(modelConfig)
                        .setMaxNumSentences(1)
                        .build();

        /*
         * IMPORTANT:
         * The Android AAR constructor requires
         * AssetManager + OfflineTtsConfig.
         */
        tts =
                new OfflineTts(
                        getAssets(),
                        config);

        return tts;
    }

    private void playAudio(
            File file,
            int req) {

        handler.post(() -> {

            if (req != requestId) {
                return;
            }

            stopAudio();

            try {

                player =
                        new MediaPlayer();

                player.setAudioAttributes(
                        new AudioAttributes.Builder()
                                .setUsage(
                                        AudioAttributes.USAGE_MEDIA)
                                .setContentType(
                                        AudioAttributes.CONTENT_TYPE_SPEECH)
                                .build());

                player.setDataSource(
                        file.getAbsolutePath());

                player.setOnCompletionListener(mp -> {

                    try {
                        mp.release();
                    } catch (Throwable ignored) {
                    }

                    player = null;

                    try {
                        file.delete();
                    } catch (Throwable ignored) {
                    }

                    sendDone(req);
                });

                player.setOnErrorListener(
                        (mp, what, extra) -> {

                            try {
                                mp.release();
                            } catch (Throwable ignored) {
                            }

                            player = null;

                            try {
                                file.delete();
                            } catch (Throwable ignored) {
                            }

                            sendError(
                                    req,
                                    "تعذر تشغيل ملف صوت كريم");

                            return true;
                        });

                player.prepare();
                player.start();

            } catch (Throwable e) {

                try {
                    if (player != null) {
                        player.release();
                    }
                } catch (Throwable ignored) {
                }

                player = null;

                try {
                    file.delete();
                } catch (Throwable ignored) {
                }

                String message =
                        e.getMessage();

                if (message == null ||
                        message.trim().isEmpty()) {
                    message = "تعذر تشغيل الصوت";
                }

                sendError(req, message);
            }
        });
    }

    private synchronized void stopAudio() {

        if (player != null) {

            try {
                if (player.isPlaying()) {
                    player.stop();
                }
            } catch (Throwable ignored) {
            }

            try {
                player.release();
            } catch (Throwable ignored) {
            }

            player = null;
        }
    }

    private void sendDone(int req) {

        Intent intent =
                new Intent(
                        OfflineTtsBridge.ACTION_DONE);

        intent.setPackage(getPackageName());

        intent.putExtra(
                OfflineTtsBridge.EXTRA_REQUEST,
                req);

        sendBroadcast(intent);
    }

    private void sendError(
            int req,
            String message) {

        Intent intent =
                new Intent(
                        OfflineTtsBridge.ACTION_ERROR);

        intent.setPackage(getPackageName());

        intent.putExtra(
                OfflineTtsBridge.EXTRA_REQUEST,
                req);

        intent.putExtra(
                OfflineTtsBridge.EXTRA_MESSAGE,
                message);

        sendBroadcast(intent);
    }

    @Override
    public void onDestroy() {

        stopAudio();

        executor.shutdownNow();

        try {
            if (tts != null) {
                tts.release();
            }
        } catch (Throwable ignored) {
        }

        tts = null;

        super.onDestroy();
    }

    @Override
    public IBinder onBind(Intent intent) {
        return null;
    }
}
