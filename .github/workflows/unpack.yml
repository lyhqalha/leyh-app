name: Build ليه قالها - Audar Story Narrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP="leyh-apk-ready-v42-audar-story-narrator.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          if [ -f project/package.json ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"
          elif [ -f project/v35work/package.json ]; then
            echo "PROJECT_ROOT=project/v35work" >> "$GITHUB_ENV"
          else
            echo "ERROR: package.json not found"
            find project -maxdepth 4 -name package.json -print
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git

      # ---------------------------------------------------------
      # IMPORTANT:
      # Create a completely clean Python virtual environment.
      # No old CUDA Torch is allowed.
      # ---------------------------------------------------------

      - name: Create clean Python environment
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          python -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          echo "Python:"
          python --version

          echo "Installing CPU-only PyTorch 2.12.1..."

          python -m pip install \
            torch==2.12.1 \
            torchaudio==2.12.1 \
            --index-url https://download.pytorch.org/whl/cpu

          echo "Installing NeuCodec..."

          python -m pip install \
            neucodec==0.0.6 \
            soundfile \
            huggingface_hub \
            librosa

          echo "Installing Audar runtime..."

          python -m pip install \
            llama-cpp-python==0.3.34

      # ---------------------------------------------------------
      # Verify that the WRONG CUDA Torch is gone.
      # ---------------------------------------------------------

      - name: Verify Python environment
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          . .venv/bin/activate

          python - <<'PY'
          import torch
          import neucodec

          print("TORCH VERSION:", torch.__version__)
          print("TORCH CUDA:", torch.version.cuda)
          print("TORCH CUDA AVAILABLE:", torch.cuda.is_available())
          print("NEUCODEC:", neucodec)

          version = torch.__version__.split("+")[0]
          major, minor, patch = [int(x) for x in version.split(".")[:3]]

          if (major, minor) < (2, 11):
              raise RuntimeError(
                  f"Wrong PyTorch version: {torch.__version__}"
              )

          if torch.version.cuda is not None:
              raise RuntimeError(
                  f"CUDA Torch detected: {torch.__version__}"
              )

          print("PYTHON ENVIRONMENT OK")
          PY

      # ---------------------------------------------------------
      # Generate the permanent MP3 story narrations.
      # ---------------------------------------------------------

      - name: Generate story narration
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          . .venv/bin/activate

          echo "Starting Audar story narration..."

          python scripts/generate_story_audio.py

      - name: Verify story audio
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          COUNT=$(find public/story-audio \
            -type f \
            -name "*.mp3" | wc -l)

          echo "Generated MP3 files: $COUNT"

          if [ "$COUNT" -lt 75 ]; then
            echo "ERROR: Expected at least 75 MP3 files."
            find public/story-audio \
              -type f \
              -name "*.mp3" \
              -print
            exit 1
          fi

          echo "ALL 75 STORY AUDIO FILES ARE READY."

      # ---------------------------------------------------------
      # Android build
      # ---------------------------------------------------------

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install --legacy-peer-deps

      - name: Pin TypeScript
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            --save-dev \
            typescript@5.9.3 \
            --legacy-peer-deps

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/local-notifications@8 \
            --save \
            --legacy-peer-deps

      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.leyhqalha.leyh',
            appName: 'ليه قالها',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Build web
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap add android

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          chmod +x scripts/prepare_android.sh
          bash scripts/prepare_android.sh

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap sync android

      # ---------------------------------------------------------
      # Make absolutely sure Kareem/Sherpa were NOT bundled.
      # ---------------------------------------------------------

      - name: Verify Android TTS removal
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "Checking for old TTS files..."

          if find android -type f \
            \( \
              -iname "*kareem*" \
              -o -iname "*sherpa*" \
              -o -iname "*.onnx" \
            \) | grep -q .; then

            echo "ERROR: Old TTS model detected."

            find android -type f \
              \( \
                -iname "*kareem*" \
                -o -iname "*sherpa*" \
                -o -iname "*.onnx" \
              \)

            exit 1
          fi

          echo "OLD TTS ENGINE REMOVED."

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leyh-audar-story-narrator
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
