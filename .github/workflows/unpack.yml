name: Build ليه قالها - Story Narrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP="./leyh-apk-ready-v41-audar-story-narrator.zip"

          echo "Checking project ZIP..."

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found:"
            echo "$ZIP"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found:"
          echo "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

      - name: Locate project
        shell: bash
        run: |
          set -e

          if [ -f "project/package.json" ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"

          elif [ -f "project/v35work/package.json" ]; then
            echo "PROJECT_ROOT=project/v35work" >> "$GITHUB_ENV"

          else
            echo "ERROR: package.json not found."
            find project -maxdepth 4 -name package.json -print
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git unzip build-essential

      - name: Create clean Python environment
        shell: bash
        run: |
          set -e

          python -m venv .tts-venv

          . .tts-venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          echo "Installing CPU-only PyTorch..."

          pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.11.0+cpu"

          echo "Installing compatible audio packages..."

          pip install \
            "neucodec>=0.1" \
            "soundfile>=0.12" \
            "librosa>=0.10" \
            "numpy>=1.24" \
            "huggingface_hub"

          echo "Installing llama.cpp Python..."

          CMAKE_ARGS="-DGGML_NATIVE=OFF" \
          pip install "llama-cpp-python"

          echo "Python environment ready."

      - name: Verify Python environment
        shell: bash
        run: |
          set -e

          . .tts-venv/bin/activate

          python - <<'PY'
          import torch
          import neucodec
          import soundfile
          import librosa
          import huggingface_hub
          import llama_cpp

          print("torch:", torch.__version__)
          print("neucodec:", getattr(neucodec, "__version__", "installed"))
          print("soundfile:", soundfile.__version__)
          print("librosa:", librosa.__version__)
          print("huggingface_hub:", huggingface_hub.__version__)
          print("llama_cpp:", llama_cpp.__version__)

          assert torch.__version__.startswith("2.11.0")
          PY

          echo "Environment verification passed."

      - name: Prepare Audar generator
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ ! -f "scripts/generate_story_audio.py" ]; then
            echo "ERROR: generator not found."
            exit 1
          fi

          cp scripts/generate_story_audio.py \
             scripts/generate_story_audio.original.py

          python - <<'PY'
          from pathlib import Path

          p = Path("scripts/generate_story_audio.py")
          s = p.read_text(encoding="utf-8")

          old = '''    run([sys.executable, "-m", "pip", "install", "-r", str(AUDIO_REPO / "examples" / "requirements.txt")])
              run([sys.executable, "-m", "pip", "install", "llama-cpp-python", "neucodec", "soundfile", "torch", "librosa", "huggingface_hub"])
          '''

          new = '''    # Dependencies are installed by the GitHub Actions workflow.
              # Do NOT install torch/torchaudio/torchao here.
          '''

          if old not in s:
              print("Generator dependency block already compatible or changed upstream.")
          else:
              s = s.replace(old, new)

          p.write_text(s, encoding="utf-8")
          PY

          echo "Generator prepared."

      - name: Generate story narration
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          . "$GITHUB_WORKSPACE/.tts-venv/bin/activate"

          echo "Starting Audar story narration..."

          python scripts/generate_story_audio.py

      - name: Verify story audio
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ ! -d "public/story-audio" ]; then
            echo "ERROR: story-audio directory does not exist."
            exit 1
          fi

          COUNT=$(find public/story-audio \
            -type f \
            -name "*.mp3" | wc -l)

          echo "Generated MP3 files: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No MP3 files generated."
            exit 1
          fi

          find public/story-audio \
            -type f \
            -name "*.mp3" \
            -print

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install --legacy-peer-deps

      - name: Pin TypeScript
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            --save-dev \
            typescript@5.9.3 \
            --legacy-peer-deps

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/local-notifications@8 \
            --save \
            --legacy-peer-deps

      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.leyhqalha.leyh',
            appName: 'ليه قالها',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Build web
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          if [ -f "scripts/prepare_android.sh" ]; then
            chmod +x scripts/prepare_android.sh
            bash scripts/prepare_android.sh
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap sync android

      - name: Remove old TTS engine
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          find android/app/src/main \
            -type f \
            \( \
              -iname "*.onnx" \
              -o -iname "*kareem*" \
              -o -iname "*sherpa*" \
              -o -iname "*OfflineTts*" \
            \) \
            -print \
            -delete || true

          echo "Old TTS files removed."

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leyh-story-narrator-v41
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
