name: Build ليه قالها - Story Narrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP="./leyh-apk-ready-v41-audar-story-narrator.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found:"
            echo "$ZIP"
            echo ""
            echo "ZIP files موجودة في المستودع:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using project:"
          echo "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Project extracted successfully."

      - name: Locate project root
        shell: bash
        run: |
          set -e

          if [ -f "project/package.json" ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"

          elif [ -f "project/v35work/package.json" ]; then
            echo "PROJECT_ROOT=project/v35work" >> "$GITHUB_ENV"

          elif [ -f "project/v40work/package.json" ]; then
            echo "PROJECT_ROOT=project/v40work" >> "$GITHUB_ENV"

          elif [ -f "project/v41work/package.json" ]; then
            echo "PROJECT_ROOT=project/v41work" >> "$GITHUB_ENV"

          else
            echo "ERROR: package.json not found."
            find project -maxdepth 4 -name package.json -print
            exit 1
          fi

      - name: Show project root
        run: |
          echo "PROJECT_ROOT=$PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git unzip

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            torch \
            soundfile \
            librosa \
            huggingface_hub \
            neucodec

      - name: Generate story narration
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ ! -f "scripts/generate_story_audio.py" ]; then
            echo "ERROR: scripts/generate_story_audio.py not found."
            echo ""
            echo "Available scripts:"
            find . -maxdepth 3 -type f -name "*.py" -print
            exit 1
          fi

          echo "Starting story narration generation..."

          python3 scripts/generate_story_audio.py

      - name: Verify story audio
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ ! -d "public/story-audio" ]; then
            echo "ERROR: public/story-audio directory not found."
            exit 1
          fi

          COUNT=$(find public/story-audio -type f -name "*.mp3" | wc -l)

          echo "Generated MP3 files: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No story MP3 files were generated."
            exit 1
          fi

          find public/story-audio -type f -name "*.mp3" -print

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install --legacy-peer-deps

      - name: Force compatible TypeScript
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            --save-dev \
            typescript@5.9.3 \
            --legacy-peer-deps

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/local-notifications@8 \
            --save \
            --legacy-peer-deps

      - name: Create Capacitor config
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.leyhqalha.leyh',
            appName: 'ليه قالها',
            webDir: 'dist',
            plugins: {
              LocalNotifications: {
                smallIcon: 'ic_stat_icon_config_sample'
              }
            }
          };

          export default config;
          EOF

      - name: Build web app
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          if [ -f "scripts/prepare_android.sh" ]; then
            chmod +x scripts/prepare_android.sh
            bash scripts/prepare_android.sh
          else
            echo "prepare_android.sh not found - continuing."
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npx cap sync android

      - name: Verify no Kareem or Sherpa
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "Checking Android project for old TTS engine..."

          if find android/app/src/main \
            -type f \
            \( \
              -iname "*.onnx" \
              -o -iname "*kareem*" \
              -o -iname "*sherpa*" \
              -o -iname "*OfflineTts*" \
            \) | grep -q .; then

            echo "ERROR: Old TTS files are still present."

            find android/app/src/main \
              -type f \
              \( \
                -iname "*.onnx" \
                -o -iname "*kareem*" \
                -o -iname "*sherpa*" \
                -o -iname "*OfflineTts*" \
              \)

            exit 1
          fi

          echo "OK: No Kareem/Sherpa TTS model found."

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leyh-story-narrator-v41
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
