name: Build ليه قالها - Story Narrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Extract project v42
        shell: bash
        run: |
          set -e
          ZIP="leyh-apk-ready-v42-audar-story-narrator.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from repository root."
            find . -maxdepth 2 -name "*.zip" -print
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

          if [ -f project/v35work/package.json ]; then
            echo "PROJECT_ROOT=project/v35work" >> "$GITHUB_ENV"
          elif [ -f project/package.json ]; then
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"
          else
            echo "ERROR: package.json not found in ZIP."
            find project -maxdepth 4 -name package.json -print
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git unzip build-essential cmake

      - name: Generate story narration
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip

          if [ ! -f scripts/generate_story_audio.py ]; then
            echo "ERROR: Audar generation script is missing."
            exit 1
          fi

          python scripts/generate_story_audio.py

      - name: Verify generated audio
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e
          if [ ! -d public/story-audio ]; then
            echo "ERROR: public/story-audio missing."
            exit 1
          fi

          COUNT=$(find public/story-audio -type f -name "*.mp3" | wc -l)
          echo "Generated MP3 files: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No MP3 files generated."
            exit 1
          fi

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --legacy-peer-deps

      - name: Pin TypeScript
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --save-dev typescript@5.9.3 --legacy-peer-deps

      - name: Install Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/local-notifications@8 \
            --save --legacy-peer-deps

      - name: Configure Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.leyhqalha.leyh',
            appName: 'ليه قالها',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Build web app
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm run build

      - name: Add Android if missing
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          if [ -f scripts/prepare_android.sh ]; then
            chmod +x scripts/prepare_android.sh
            bash scripts/prepare_android.sh
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leyh-story-narrator-v42
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
