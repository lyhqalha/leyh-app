name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q leyh-apk-ready-v2.zip -d extracted

          if [ -d "extracted/leyh/leyh" ]; then
            cp -R extracted/leyh/leyh/. .
          elif [ -d "extracted/leyh" ]; then
            cp -R extracted/leyh/. .
          else
            cp -R extracted/. .
          fi

          echo "Project files:"
          ls -la

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fix TypeScript version
        run: npm install --save-dev typescript@5.9.3 --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 --save --legacy-peer-deps
          npm install @capacitor/local-notifications@8 --save --legacy-peer-deps
          npm install @capacitor/assets --save-dev --legacy-peer-deps

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.leyhqalha.leyh',
            appName: 'ليه قالها',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leyh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
